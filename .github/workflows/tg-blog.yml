name: tg blog
on:
  schedule:
    - cron: "0 6 * * *" # раз в сутки, 09:00 МСК
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/tg_blog.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add blog
          git diff --cached --quiet || (git commit -m "blog: update from telegram" && git push)
