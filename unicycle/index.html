<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Unicycle Defeat — prototype</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #222; }
    #game { width: 100vw; height: 100vh; height: 100dvh; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module">
    import { UnicycleGame } from './src/unicycle-game.js';
    // GitHub Pages has no log server; local development still streams CSV to dev-server.js.
    const logEndpoint = location.hostname.endsWith('.github.io') ? null : '/log';
    new UnicycleGame(document.getElementById('game'), { logEndpoint }).start();
  </script>
</body>
</html>
