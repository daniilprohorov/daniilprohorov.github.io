<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #ccc; }
    body { display: flex; align-items: center; justify-content: center; }
    #screen_container > div { white-space: pre; font: 14px monospace; line-height: 14px; }
    /* v86 shrinks the canvas by a fractional devicePixelRatio, while mouse
       deltas stay in CSS px: size the canvas ourselves, one guest px per CSS px. */
    #screen_container > canvas { width: auto !important; height: auto !important; image-rendering: pixelated; }
    noscript { font-family: sans-serif; }
    noscript a { color: #8cf; }
  </style>
</head>
<body>
  <noscript>
    <h1>Проекты</h1>
    <ul>
      <li><a href="./bikeGeometry/">Bike Geometry</a></li>
    </ul>
  </noscript>
  <div id="screen_container">
    <div></div>
    <canvas style="display: none"></canvas>
  </div>
  <script src="/v86/libv86.js"></script>
  <script src="/desktop.js"></script>
</body>
</html>
