<script>
  const days = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  function tick() {
    const d = new Date(), h = d.getHours(), m = d.getMinutes();
    document.getElementById('clockText').textContent =
      `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    document.getElementById('hHand').setAttribute('transform', `rotate(${(h % 12) * 30 + m / 2} 80 100)`);
    document.getElementById('mHand').setAttribute('transform', `rotate(${m * 6} 80 100)`);
    document.getElementById('sHand').setAttribute('transform', `rotate(${d.getSeconds() * 6} 80 100)`);
  }
  tick(); setInterval(tick, 1000);
</script>
